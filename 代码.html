<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>源码托管 · 一键建站</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0d12;--card:#141a24;--card2:#1b2231;--line:#242d3d;
  --fg:#e9eef8;--dim:#8b97ab;--acc:#4d8dff;--acc2:#9a6bff;
  --ok:#2ecc71;--warn:#ffb020;--err:#ff5d5d;
}
html,body{margin:0}
body{
  background:radial-gradient(circle at 20% -10%,#1a2440,#0b0d12 55%) fixed #0b0d12;
  color:var(--fg);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.5;min-height:100%;
}
[hidden]{display:none!important}
body.stage{overflow:hidden}
body.stage main,body.stage #bar,body.stage #tabs{display:none}

/* 顶部 */
#bar{
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;
}
#bar .logo{
  width:38px;height:38px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--acc),var(--acc2));font-size:19px;font-weight:700;color:#fff;
}
#bar .tt{flex:1;min-width:0}
#bar .tt b{display:block;font-size:16px}
#bar .tt span{display:block;font-size:11px;color:var(--dim)}
#chip{
  display:flex;align-items:center;gap:6px;max-width:44%;font-size:11px;color:var(--dim);
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 10px;
  font-family:ui-monospace,Menlo,monospace;
}
#host{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.dot.bad{background:var(--err);box-shadow:0 0 6px var(--err)}

/* 主体 */
main{padding:0 14px calc(88px + env(safe-area-inset-bottom))}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px;margin-bottom:12px;
}
.card.warn{border-color:#5a2a33;background:#1d1418}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.ch h2{margin:0;font-size:14px;font-weight:600}
.ch em{font-size:11px;color:var(--dim);font-style:normal}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 6px}
label em{color:#5c6a80;font-style:normal}
input,textarea{
  width:100%;background:#0e131b;border:1px solid var(--line);border-radius:11px;
  color:var(--fg);padding:11px 12px;font-size:13px;font-family:inherit;outline:none;
}
input:focus,textarea:focus{border-color:#3a5f9e}
textarea{
  min-height:180px;resize:vertical;white-space:pre-wrap;word-break:break-all;
  -webkit-overflow-scrolling:touch;overflow:auto;
  font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.6;
}
.filecard{margin-bottom:8px}
.filecard .row{margin-bottom:6px}
.fname{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;padding:8px 10px}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:13px}
.mini{
  background:var(--card2);border:1px solid var(--line);border-radius:9px;
  padding:7px 11px;font-size:12px;color:var(--fg);
}
.add{width:100%;border-style:dashed;color:var(--dim);margin-top:2px}
.go{
  width:100%;margin-top:14px;padding:14px;border-radius:13px;font-size:15px;font-weight:600;color:#fff;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
}
.go:disabled{opacity:.55}
.hint{font-size:11.5px;color:var(--dim);margin-top:10px;line-height:1.6;word-break:break-all;min-height:16px}
.hint.bad{color:var(--err)}
.hint b{color:var(--acc)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.pill{
  flex:1;min-width:72px;text-align:center;padding:9px 8px;border-radius:9px;
  background:#0e131b;border:1px solid var(--line);color:var(--fg);font-size:12px;
}
.pill.go{background:linear-gradient(135deg,#3f7bff,#7b5cff);border-color:transparent;color:#fff;font-weight:600}
.pill.bad{color:#ff8b8b;border-color:#4a2530;background:#1d1319}
.empty{text-align:center;color:var(--dim);font-size:12.5px;padding:16px 0;line-height:1.8}

/* 列表 */
.site{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:9px}
.st{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.st b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st em{font-size:11px;color:var(--dim);font-style:normal;flex:none}
.surl{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#7fa6ff;word-break:break-all;margin:6px 0 9px;line-height:1.5}

/* 结果 */
.rh{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.rh i{width:18px;height:18px;border-radius:50%;background:var(--ok);color:#05210f;font-style:normal;
  display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}
.card.warn .rh i{background:var(--warn);color:#2a1a00}
#rurl{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#8fc0ff;background:#0e131b;
  border:1px solid var(--line);border-radius:9px;padding:10px;margin:10px 0;word-break:break-all}
.note{font-size:11.5px;color:var(--dim);line-height:1.7;margin:8px 0 0}
.foot{font-size:11px;color:#5c6a80;line-height:1.9;margin:6px 2px 0}
.foot code{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:1px 5px;
  font-size:10.5px;word-break:break-all;cursor:pointer}

/* 底部导航 */
#tabs{
  position:fixed;left:0;right:0;bottom:0;display:flex;z-index:40;
  background:rgba(15,19,27,.96);border-top:1px solid var(--line);
  padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 0;font-size:11px;color:var(--dim);border-radius:11px;
}
.tab span{font-size:18px;line-height:1}
.tab.on{color:#a8c8ff;background:rgba(77,141,255,.1)}

/* 站点全屏 */
#stage{position:fixed;inset:0;z-index:90;background:#000}
#frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#sbtns{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:8px;z-index:95}
#sbtns button{
  width:44px;height:44px;border-radius:22px;font-size:17px;color:#fff;
  background:rgba(20,25,35,.72);border:1px solid rgba(255,255,255,.16);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(8,10,15,.9);color:var(--dim);font-size:12.5px;z-index:96;pointer-events:none}

/* 提示 */
#toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 78px);transform:translateX(-50%);
  background:#1d2637;border:1px solid #33405a;color:var(--fg);font-size:12.5px;
  padding:9px 16px;border-radius:999px;max-width:86%;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .18s;z-index:99;
}
#toast.show{opacity:1}
#errbar{
  position:fixed;left:8px;right:8px;top:8px;z-index:9999;background:#3a1420;
  border:1px solid var(--err);color:#ffdede;font-family:ui-monospace,Menlo,monospace;
  font-size:11.5px;line-height:1.6;padding:9px 11px;border-radius:11px;white-space:pre-wrap;
  max-height:40vh;overflow:auto;pointer-events:none;
}
</style>
</head>
<body>

<div id="bar">
  <div class="logo">⌘</div>
  <div class="tt"><b>源码托管</b><span>粘贴源码 · 一键建站</span></div>
  <div id="chip"><i class="dot" id="dot"></i><span id="host">—</span></div>
</div>

<main id="admin">
  <section class="card">
    <div class="ch"><h2>部署新站点</h2><button class="mini" id="demo">填入示例</button></div>

    <label>站点名称 <em>留空自动取 &lt;title&gt;</em></label>
    <input id="name" placeholder="我的小站" autocomplete="off">

    <label>粘贴源码 <em>多文件用 === 文件名 === 分隔</em></label>
    <div class="filecard">
      <input id="f0" class="fname" value="index.html" autocomplete="off" spellcheck="false">
      <textarea id="code" spellcheck="false" placeholder="把 HTML / CSS / JS 源码粘贴到这里…"></textarea>
    </div>
    <div id="more"></div>
    <button class="mini add" id="addfile">＋ 添加文件</button>

    <div class="hint" id="hint"></div>
    <button class="go" id="deploy">一键部署</button>
  </section>

  <section class="card" id="result" hidden>
    <div class="rh"><i>✓</i><span id="rtitle">部署成功</span></div>
    <div id="rurl"></div>
    <p class="note" id="rnote"></p>
    <div class="row">
      <button class="pill go" id="ropen">打开站点</button>
      <button class="pill" id="rcopy">复制链接</button>
    </div>
  </section>

  <section class="card">
    <div class="ch"><h2>我的站点</h2><em id="count"></em></div>
    <div id="list"></div>
    <div class="row" style="margin-top:10px">
      <button class="pill" id="sync">↻ 从云端同步</button>
    </div>
  </section>

  <section class="card">
    <div class="ch"><h2>站点工具栏</h2><em>打开站点时显示</em></div>
    <button class="pill go" id="toolsToggle" style="width:100%">…</button>
    <p class="note">控制打开站点时右下角的三个浮动按钮：⛶ 全屏 / ⟳ 旋转 / ⧉ 复制链接。关闭后打开站点不再显示，需回到本页重新开启。</p>
  </section>

  <p class="foot">
    站点数据保存在云端 JSON：<code id="apihost">api.npoint.io</code>（点它可换仓库）<br>
    链接形如 <code id="footurl">/#/s/xxxx</code>，自动跟随当前域名，换托管平台不用改代码。<br>
    站内 css / js 会自动内联；图片请用外链或 data URL。
  </p>
</main>

<main id="visit" hidden>
  <section class="card">
    <div class="ch"><h2>我的 IP</h2><button class="mini" id="iprefresh">↻ 重新获取</button></div>
    <div id="ipbody"><div class="empty">正在获取…</div></div>
    <p class="note">点 IP 可复制。国家 / 省份 / 城市来自 IP 归属地库，不是 GPS 定位。</p>
  </section>

  <section class="card">
    <div class="ch"><h2>访问统计</h2><em id="vcount"></em></div>
    <div id="vsum"></div>
    <div id="vlist"></div>
  </section>
</main>

<nav id="tabs">
  <button class="tab on" data-tab="admin"><span>🏗</span>建站</button>
  <button class="tab" data-tab="visit"><span>📊</span>访问</button>
</nav>

<div id="stage" hidden>
  <iframe id="frame" allowfullscreen
    sandbox="allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe>
  <div id="sbtns" hidden>
    <button id="fs" title="全屏">⛶</button>
    <button id="rt" title="旋转">⟳</button>
    <button id="cp" title="复制链接">⧉</button>
  </div>
  <div id="load" hidden>正在加载…</div>
</div>

<div id="toast"></div>

<script>
var API = 'https://api.npoint.io/3182686b52a8ba4bb352';

/* ========== 基础 ========== */
function $(s){ return document.querySelector(s); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
var toastTimer = null;
function toast(m){
  var el = $('#toast');
  if (!el) return;
  el.textContent = m;
  el.className = 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.className = ''; }, 2400);
}
function copy(t){
  function fb(){
    var ta = document.createElement('textarea');
    ta.value = t;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.parentNode.removeChild(ta);
    toast('已复制');
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(function(){ toast('已复制'); }, fb);
  } else fb();
}
var _ebN = 0, _ebTimer = null;
function errbar(m){
  if (_ebN++ > 5) return;
  var b = document.getElementById('errbar');
  if (!b) {
    b = document.createElement('div');
    b.id = 'errbar';
    document.body.appendChild(b);
  }
  b.textContent = (b.textContent ? b.textContent + '\n' : '') + m;
  clearTimeout(_ebTimer);
  _ebTimer = setTimeout(function(){
    if (b.parentNode) b.parentNode.removeChild(b);
    _ebN = 0;
  }, 8000);
}
window.onerror = function(msg, url, line){
  errbar('脚本错误：' + msg + '（第 ' + line + ' 行）');
};

/* ========== 站点工具栏开关 ========== */
var TOOLS_K = 'wta_tools_v1';
var TOOLS_ON = true;
try { if (localStorage.getItem(TOOLS_K) === '0') TOOLS_ON = false; } catch (e) {}
function renderToolsToggle(){
  var b = $('#toolsToggle');
  if (!b) return;
  b.textContent = TOOLS_ON
    ? '✓ 已开启 · 打开站点显示 3 个按钮'
    : '✗ 已关闭 · 打开站点不显示按钮';
  b.className = 'pill ' + (TOOLS_ON ? 'go' : 'bad');
  b.style.width = '100%';
}

/* ========== 云端存储 ========== */
var DOC = { sites: {} };
var DOC_T = 0;
var LSK = 'wta_doc_v4';

function norm(j){
  var d = { sites: {}, rev: 0 };
  if (j && typeof j === 'object' && !Array.isArray(j)) {
    if (j.sites && typeof j.sites === 'object' && !Array.isArray(j.sites)) {
      d.sites = j.sites;
    } else {
      Object.keys(j).forEach(function(k){
        var v = j[k];
        if (v && typeof v === 'object' && v.files) d.sites[k] = v;
      });
    }
    d.rev = j.rev || 0;
  }
  return d;
}
function apiGet(){
  return fetch(API + '?t=' + Date.now(), { cache: 'no-store' }).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function(t){
    var j = null;
    if (t && t.trim()) {
      try { j = JSON.parse(t); } catch (e) { throw new Error('云端不是合法 JSON'); }
    }
    return norm(j);
  });
}
function apiPut(d){
  d.rev = Date.now();
  var body = JSON.stringify(d);
  var ms = ['POST', 'PUT', 'PATCH'];
  var i = 0;
  function step(){
    if (i >= ms.length) return Promise.reject(new Error('云端拒绝写入'));
    var m = ms[i++];
    return fetch(API, { method: m, headers: { 'Content-Type': 'application/json' }, body: body })
      .then(function(r){
        if (!r.ok) throw new Error(m + ' ' + r.status);
        return apiGet();
      })
      .then(function(c){
        if (c.rev >= d.rev) return d;
        throw new Error('写入未生效');
      })
      .catch(function(){
        if (i >= ms.length) throw new Error('云端写入失败');
        return new Promise(function(res){ setTimeout(res, 350 * i); }).then(step);
      });
  }
  return step();
}
function cacheSave(){
  try { localStorage.setItem(LSK, JSON.stringify({ t: Date.now(), sites: DOC.sites })); } catch (e) {}
}
function cacheLoad(){
  try {
    var o = JSON.parse(localStorage.getItem(LSK) || 'null');
    if (o && o.sites && typeof o.sites === 'object') { DOC.sites = o.sites; }
  } catch (e) {}
}
function dot(ok){
  var el = $('#dot');
  if (el) el.className = 'dot ' + (ok ? 'ok' : 'bad');
}
function load(force){
  if (!force && DOC_T && Date.now() - DOC_T < 15000) return Promise.resolve(DOC);
  return apiGet().then(function(d){
    DOC.sites = d.sites;
    DOC.rev = d.rev;
    DOC_T = Date.now();
    cacheSave();
    dot(true);
    return DOC;
  }, function(e){
    dot(false);
    throw e;
  });
}

/* ========== 源码解析 ========== */
function encPath(p){
  return String(p).split('/').map(encodeURIComponent).join('/');
}
function normPath(p){
  p = String(p || '').trim().replace(/\\/g, '/').replace(/^\/+/, '');
  var a = [];
  p.split('/').forEach(function(s){
    if (!s || s === '.') return;
    if (s === '..') { a.pop(); return; }
    a.push(s);
  });
  return a.join('/');
}
function baseUrl(){
  if (location.protocol === 'http:' || location.protocol === 'https:') {
    return location.origin + location.pathname.replace(/index\.html?$/i, '');
  }
  return location.href.split('#')[0];
}
function urlOf(site, page){
  var u = baseUrl() + '#/s/' + site.id;
  if (page && page !== site.entry) u += '/' + encPath(page);
  return u;
}
function parseMulti(t){
  var re = /^[ \t]*===[ \t]*(.+?)[ \t]*===[ \t]*$/gm;
  var m, marks = [];
  while ((m = re.exec(t))) marks.push({ n: m[1], h: m.index, s: re.lastIndex });
  if (!marks.length) return null;
  return marks.map(function(k, i){
    var end = i + 1 < marks.length ? marks[i + 1].h : t.length;
    return [normPath(k.n), t.slice(k.s, end).replace(/^\r?\n/, '')];
  });
}
function collect(){
  var files = {};
  var code = $('#code').value;
  var multi = code.trim() ? parseMulti(code) : null;
  if (multi && multi.length) {
    multi.forEach(function(p){ if (p[0]) files[p[0]] = { text: p[1] }; });
  } else if (code.trim()) {
    files[normPath($('#f0').value) || 'index.html'] = { text: code };
  }
  Array.prototype.forEach.call(document.querySelectorAll('#more .filecard'), function(c){
    var p = normPath(c.querySelector('.fname').value);
    var t = c.querySelector('textarea').value;
    if (p && t.trim()) files[p] = { text: t };
  });
  return files;
}
function entryOf(files){
  var ks = Object.keys(files || {});
  if (!ks.length) return null;
  var low = {};
  ks.forEach(function(k){ low[k.toLowerCase()] = k; });
  var pref = ['index.html', 'index.htm', 'default.html', 'main.html', 'home.html'];
  for (var i = 0; i < pref.length; i++) if (low[pref[i]]) return low[pref[i]];
  var h = ks.filter(function(k){ return /\.html?$/i.test(k); });
  return h.length ? h[0] : null;
}
function titleOf(h){
  var m = /<title[^>]*>([\s\S]{0,120}?)<\/title>/i.exec(h || '');
  return m ? m[1].replace(/\s+/g, ' ').trim() : '';
}
function findFile(site, p){
  var files = site.files || {};
  var n = normPath(p);
  if (!n) n = 'index.html';
  if (files[n]) return { path: n, text: files[n].text || '' };
  var low = n.toLowerCase(), hit = null;
  Object.keys(files).forEach(function(k){
    if (!hit && k.toLowerCase() === low) hit = k;
  });
  if (hit) return { path: hit, text: files[hit].text || '' };
  if (!/\.[a-z0-9]{1,6}$/i.test(n)) return findFile(site, n + '/index.html');
  return null;
}
function absOf(from, ref){
  if (!ref) return null;
  ref = String(ref).trim();
  if (!ref || ref.charAt(0) === '#' || /^(data|blob|javascript|mailto|tel|about):/i.test(ref)) return null;
  var u;
  try { u = new URL(ref, 'https://s.local/' + encPath(from)); } catch (e) { return null; }
  if (u.host !== 's.local') return null;
  var p = u.pathname.replace(/^\/+/, '');
  try { p = decodeURIComponent(p); } catch (e) {}
  return p;
}
function build(site, pagePath){
  var f = findFile(site, pagePath);
  if (!f) {
    return '<!DOCTYPE html><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;' +
      'font-family:system-ui,sans-serif;background:#11141a;color:#dfe6f2;text-align:center;padding:24px">' +
      '<div><h2 style="margin:0 0 8px;font-size:18px">页面不存在</h2>' +
      '<p style="color:#8b97ab;font-size:13px">/' + esc(pagePath) + '</p></div></body>';
  }
  var d;
  try {
    d = new DOMParser().parseFromString(f.text || '', 'text/html');
  } catch (e) {
    d = new DOMParser().parseFromString('<pre>' + esc(f.text) + '</pre>', 'text/html');
  }
  d.querySelectorAll('base').forEach(function(el){ el.remove(); });

  d.querySelectorAll('link[href]').forEach(function(el){
    if ((el.getAttribute('rel') || '').toLowerCase().indexOf('stylesheet') < 0) return;
    var p = absOf(f.path, el.getAttribute('href'));
    var g = p && findFile(site, p);
    if (!g) return;
    var s = d.createElement('style');
    s.textContent = (g.text || '').replace(/<\/style/gi, '<\\/style');
    el.parentNode.replaceChild(s, el);
  });

  d.querySelectorAll('script[src]').forEach(function(el){
    var p = absOf(f.path, el.getAttribute('src'));
    var g = p && findFile(site, p);
    if (!g) return;
    var s = d.createElement('script');
    Array.prototype.forEach.call(el.attributes, function(a){
      if (/^(src|integrity|crossorigin|referrerpolicy)$/i.test(a.name)) return;
      s.setAttribute(a.name, a.value);
    });
    s.textContent = (g.text || '').replace(/<\/script/gi, '<\\/script');
    el.parentNode.replaceChild(s, el);
  });

  d.querySelectorAll('a[href]').forEach(function(el){
    var href = (el.getAttribute('href') || '').trim();
    if (!href || href.charAt(0) === '#') return;
    var p = absOf(f.path, href);
    if (p === null) {
      el.setAttribute('target', '_blank');
      el.setAttribute('rel', 'noopener noreferrer');
      return;
    }
    if (findFile(site, p)) {
      el.setAttribute('data-go', p);
      el.setAttribute('href', '#');
    }
  });

  if (!d.querySelector('meta[name="viewport"]')) {
    var mv = d.createElement('meta');
    mv.setAttribute('name', 'viewport');
    mv.setAttribute('content', 'width=device-width,initial-scale=1');
    var head = d.head || d.documentElement;
    head.insertBefore(mv, head.firstChild);
  }

  var sh = d.createElement('script');
  sh.textContent = "document.addEventListener('click',function(e){var a=e.target&&e.target.closest?e.target.closest('[data-go]'):null;if(a){e.preventDefault();parent.postMessage({go:a.getAttribute('data-go')},'*');}},true);";
  (d.body || d.documentElement).appendChild(sh);

  return '<!DOCTYPE html>' + d.documentElement.outerHTML;
}

function deploy(){
  var files = collect();
  var ks = Object.keys(files);
  if (!ks.length) { toast('还没有源码，先粘贴或点「填入示例」'); return; }
  var e = entryOf(files);
  if (!e) { toast('缺少 .html 页面，至少需要一个 index.html'); return; }

  var btn = $('#deploy');
  var label = btn.textContent;
  btn.disabled = true;
  btn.textContent = '部署中…';

  var id = editing || ('s' + Math.random().toString(36).slice(2, 8));
  var site = {
    id: id,
    name: ($('#name').value || '').trim() || titleOf(files[e].text) || '未命名站点',
    entry: e,
    files: files,
    views: 0,
    visits: [],
    createdAt: Date.now(),
    updatedAt: Date.now()
  };

  load(true).then(function(){
    var prev = DOC.sites[id];
    if (prev) {
      site.createdAt = prev.createdAt || site.createdAt;
      site.views = prev.views || 0;
      site.visits = prev.visits || [];
    }
    DOC.sites[id] = site;
    return apiPut(DOC);
  }).then(function(d){
    DOC.sites = d.sites;
    DOC_T = Date.now();
    cacheSave();
    dot(true);
    btn.disabled = false;
    btn.textContent = label;
    clearEditor();
    renderList();
    showResult(site, true, '');
    toast('部署成功');
  }).catch(function(err){
    btn.disabled = false;
    btn.textContent = label;
    dot(false);
    renderList();
    showResult(site, false, err && err.message ? err.message : String(err));
  });
}

      '<p style="color:#8b97ab;font-size:13px">可能链接有误，或站点已被删除</p></div></body>';

  if (document.body.className !== 'stage') return;
  document.body.className = '';
  $('#stage').hidden = true;
  $('#frame').removeAttribute('srcdoc');
  cur = null;
  document.title = '源码托管 · 一键建站';
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  renderList();
}
function route(){
  var m = /^#?\/?s\/([^\/]+)(?:\/(.*))?$/.exec(location.hash);
  if (m) {
    openSite(decodeURIComponent(m[1]), m[2] ? decodeURIComponent(m[2]) : null);
  } else {
    closeStage();
    if (!$('#admin').hidden) renderList();
  }
}

var GEOK = 'wta_geo_v4';
var CC = {

  GB:'英国', DE:'德国', FR:'法国', RU:'俄罗斯', AU:'澳大利亚', CA:'加拿大', BR:'巴西',
  NL:'荷兰', ES:'西班牙', IT:'意大利', SE:'瑞典', CH:'瑞士', TR:'土耳其', AE:'阿联酋',
  NZ:'新西兰', ZA:'南非', MX:'墨西哥', AR:'阿根廷', PL:'波兰', UA:'乌克兰', IE:'爱尔兰',
  PT:'葡萄牙', BE:'比利时', AT:'奥地利', DK:'丹麦', NO:'挪威', FI:'芬兰', CZ:'捷克',

  IR:'伊朗', IQ:'伊拉克', KZ:'哈萨克斯坦', MN:'蒙古', LA:'老挝', KH:'柬埔寨', MM:'缅甸',
  NP:'尼泊尔', LK:'斯里兰卡', KP:'朝鲜', CU:'古巴', VE:'委内瑞拉', CL:'智利', CO:'哥伦比亚'
};
var PV = {
  beijing:'北京市', shanghai:'上海市', tianjin:'天津市', chongqing:'重庆市',
  hebei:'河北省', shanxi:'山西省', liaoning:'辽宁省', jilin:'吉林省',
  heilongjiang:'黑龙江省', jiangsu:'江苏省', zhejiang:'浙江省', anhui:'安徽省',
  fujian:'福建省', jiangxi:'江西省', shandong:'山东省', henan:'河南省',
  hubei:'湖北省', hunan:'湖南省', guangdong:'广东省', hainan:'海南省',
  sichuan:'四川省', guizhou:'贵州省', yunnan:'云南省', shaanxi:'陕西省',
  gansu:'甘肃省', qinghai:'青海省', taiwan:'台湾省', innermongolia:'内蒙古自治区',
  neimenggu:'内蒙古自治区', guangxi:'广西壮族自治区', tibet:'西藏自治区',
  xizang:'西藏自治区', ningxia:'宁夏回族自治区', xinjiang:'新疆维吾尔自治区',
  hongkong:'香港特别行政区', macau:'澳门特别行政区', macao:'澳门特别行政区'
};

function flagOf(cc){
  cc = String(cc || '').toUpperCase();
  if (!/^[A-Z]{2}$/.test(cc)) return '';
  return String.fromCodePoint(0x1F1E6 + cc.charCodeAt(0) - 65, 0x1F1E6 + cc.charCodeAt(1) - 65);
}
function provZh(n){
  var k = String(n || '').toLowerCase().replace(/[\s\-_.]/g, '');
  return PV[k] || '';
}
function whereText(g){
  if (!g) return '未知';
  var cc = String(g.cc || '').toUpperCase();
  var name = CC[cc] || g.country || '';
  var head = [flagOf(cc), name].filter(Boolean).join(' ');
  var seen = {}, rest = [];
  [g.province, g.city].forEach(function(x){
    if (!x || x === name || x === g.country || seen[x]) return;
    seen[x] = 1;
    rest.push(x);
  });
  var out = head || (g.ip ? '未知地区' : '未知');
  if (rest.length) out += ' · ' + rest.join(' · ');
  return out;
}
function geoCache(){
  if (GEO && GEO.ip) return GEO;
  try {
    var o = JSON.parse(localStorage.getItem(GEOK) || 'null');
    if (o && o.t && Date.now() - o.t < 600000 && o.g && o.g.ip) { GEO = o.g; return GEO; }
  } catch (e) {}
  return null;
}
function jget(u, ms){
  return new Promise(function(res, rej){
    var done = false;
    var t = setTimeout(function(){
      if (done) return;
      done = true;
      rej(new Error('timeout'));
    }, ms || 6000);
    fetch(u, { cache: 'no-store' }).then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(j){
      if (done) return;
      done = true;
      clearTimeout(t);
      res(j);
    }, function(e){
      if (done) return;
      done = true;
      clearTimeout(t);
      rej(e);
    });
  });
}
function geo(force){
  if (!force) {
    var c = geoCache();
    if (c) return Promise.resolve(c);
  }
  var out = { ip:'', cc:'', country:'', province:'', city:'', isp:'' };
  function merge(p){
    if (!p) return;
    ['ip', 'cc', 'country', 'province', 'city', 'isp'].forEach(function(k){
      if (!out[k] && p[k]) out[k] = p[k];
    });
  }
  return jget('https://qifu-api.baidubce.com/ip/local/geo/v1/district', 5000).then(function(j){
    var d = (j && (j.data || j)) || {};
    merge({
      ip: d.ip || '',
      cc: d.country_code || (/中国/.test(d.country || '') ? 'CN' : ''),
      country: d.country || '',
      province: d.province || d.prov || '',
      city: d.city || '',
      isp: d.isp || d.owner || ''
    });
  }, function(){}).then(function(){
    if (out.ip && out.province) return;
    return jget('https://ipwho.is/', 6000).then(function(j){
      if (!j || j.success === false || !j.ip) return;
      var cc = j.country_code || '';
      var pv = j.region || '';
      if (cc === 'CN') pv = provZh(pv) || pv;
      merge({
        ip: j.ip, cc: cc, country: j.country || '', province: pv,
        city: j.city || '', isp: (j.connection && j.connection.isp) || ''
      });
    }, function(){});
  }).then(function(){
    if (out.ip) return out;
    return jget('https://ipapi.co/json/', 6000).then(function(j){
      if (!j || !j.ip) throw new Error('bad');
      var cc = j.country_code || '';
      var pv = j.region || '';
      if (cc === 'CN') pv = provZh(pv) || pv;
      merge({
        ip: j.ip, cc: cc, country: j.country_name || '', province: pv,
        city: j.city || '', isp: j.org || ''
      });
      return out;
    });
  }).then(function(r){
    if (!r || !r.ip) return null;
    GEO = r;
    try { localStorage.setItem(GEOK, JSON.stringify({ t: Date.now(), g: r })); } catch (e) {}
    return r;
  }, function(){
    return null;
  });
}

/* ========== 访问统计 ========== */
var TRACKED = {};

function track(site){
  if (!site || !site.id) return;
  if (TRACKED[site.id] && Date.now() - TRACKED[site.id] < 20000) return;
  TRACKED[site.id] = Date.now();
  geo().then(function(g){
    return load(true).then(function(){
      var s = DOC.sites[site.id];
      if (!s) return;
      var list = Array.isArray(s.visits) ? s.visits : [];
      list.unshift({
        t: Date.now(),
        ip: g ? g.ip : '',
        cc: g ? g.cc : '',
        c: g ? g.country : '',
        p: g ? g.province : '',
        ci: g ? g.city : '',
        isp: g ? g.isp : ''
      });
      s.views = (s.views || 0) + 1;
      s.visits = list.slice(0, 20);
      return apiPut(DOC).then(function(d){
        DOC.sites = d.sites;
        DOC_T = Date.now();
        cacheSave();
      }, function(){ dot(false); });
    });
  }).catch(function(){});
}

function renderIP(force){

  geo(force).then(function(g){
    if (!g || !g.ip) {
      el.innerHTML = '<div class="empty">获取失败<br>归属地接口可能被当前网络拦截</div>';

function renderStats(){
  var total = 0;
  var rows = [];
  SITES.forEach(function(s){
    total += (s.views || 0);
    (Array.isArray(s.visits) ? s.visits : []).forEach(function(v){
      rows.push({ s: s, v: v });
    });
  });
  rows.sort(function(a, b){ return (b.v.t || 0) - (a.v.t || 0); });
  $('#vcount').textContent = rows.length ? '共 ' + rows.length + ' 条' : '';

  var cc = {};
  rows.forEach(function(r){ if (r.v.cc) cc[r.v.cc] = 1; });

  $('#vsum').innerHTML = '<div class="row" style="margin-bottom:10px">' +
    '<div class="pill" style="flex:1"><div style="font-size:18px;font-weight:600">' + total + '</div>总访问</div>' +
    '<div class="pill" style="flex:1"><div style="font-size:18px;font-weight:600">' + SITES.length + '</div>站点数</div>' +
    '<div class="pill" style="flex:1"><div style="font-size:18px;font-weight:600">' + Object.keys(cc).length + '</div>地区数</div>' +
    '</div>';

  $('#vlist').innerHTML = rows.length ? rows.slice(0, 30).map(function(r){
    var v = r.v;

      'padding:9px;margin-bottom:8px">' +
      '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--dim)">' +
        '<span>' + esc(r.s.name || '未命名站点') + '</span><span>' + timeText(v.t) + '</span></div>' +
      '<div style="font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#a9c4ff;' +
        'margin:5px 0 3px;word-break:break-all">' + esc(v.ip || 'IP 未知') + '</div>' +
      '<div style="font-size:11.5px;color:#9fb0cc;line-height:1.6">' + esc(whereText(v)) +
        (v.isp ? ' · ' + esc(v.isp) : '') + '</div></div>';
  }).join('') : '<div class="empty">还没有访问记录<br>把站点链接发给别人打开试试</div>';
}
function timeText(t){
  if (!t) return '';
  var d = Date.now() - t;
  if (d < 60000) return '刚刚';
  if (d < 3600000) return Math.floor(d / 60000) + ' 分钟前';
  if (d < 86400000) return Math.floor(d / 3600000) + ' 小时前';
  var x = new Date(t);
  return (x.getMonth() + 1) + '/' + x.getDate() + ' ' +
    String(x.getHours()).padStart(2, '0') + ':' + String(x.getMinutes()).padStart(2, '0');
}

$('#list').onclick = function(e){

  if (!b) return;

    openSite(id, null);

    copy(urlOf(s));

    if (!confirm('删除站点「' + (s.name || '未命名站点') + '」？不可恢复。')) return;
    delete DOC.sites[id];
    apiPut(DOC).then(function(d){
      DOC.sites = d.sites;
      DOC_T = Date.now();
      cacheSave();
      toast('已删除');
      renderList();
    }, function(err){
      toast('删除失败：' + (err && err.message ? err.message : err));
      load(true).then(renderList, function(){ renderList(); });
    });
  }
};

/* 全屏 */
$('#fs').onclick = function(){
  var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (fsEl) {
    var ex = document.exitFullscreen || document.webkitExitFullscreen;
    if (ex) {
      try { var r0 = ex.call(document); if (r0 && r0.catch) r0.catch(function(){}); } catch (e) {}
    }
    return;
  }
  var el = document.documentElement;
  var fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!fn) { toast('当前浏览器不支持全屏'); return; }
  try {
    var r = fn.call(el);
    if (r && r.catch) r.catch(function(){ toast('无法进入全屏'); });
  } catch (e) { toast('无法进入全屏'); }
};

/* 旋转 */
$('#rt').onclick = function(){
  var so = screen.orientation;
  if (!so || !so.lock) { toast('当前浏览器不支持方向锁定，可手动旋转屏幕'); return; }
  var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (!fsEl) {
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fn) {
      try {
        var r = fn.call(el);
        if (r && r.catch) r.catch(function(){});
      } catch (e) {}
    }
  }
  setTimeout(function(){
    try { if (so.unlock) so.unlock(); } catch (e) {}
    var p = null;
    try { p = so.lock('any'); } catch (e) {}
    if (p && p.catch) p.catch(function(){ toast('旋转锁定失败，可手动旋转屏幕'); });
    else toast('已请求允许屏幕旋转');
  }, 150);
};
